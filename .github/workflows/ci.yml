name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@537643d2d3489c83f4fddc3d8ab093885863e9d4 # v4.0.0

      - uses: actions/setup-node@1e60f620b9541d399f7b940fac5d0022e6a4c317 # v6.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
